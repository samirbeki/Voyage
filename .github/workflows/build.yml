name: Build and test

on:
  push:
    branches: [ master, main, advanced ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore Voyage.slnx

      - name: Build
        run: dotnet build Voyage.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Voyage.slnx --configuration Release --no-build --verbosity normal
